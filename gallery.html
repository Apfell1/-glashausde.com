<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="pageTitle">GH Service | Galerie – Montage von Fenstern</title>
    <meta name="description" content="Sehen Sie sich unsere abgeschlossenen Projekte zur Fenstermontage und dem Einbau von Fenstern in Deutschland an.">
    <link rel="stylesheet" href="style.css">
    <style>
        /* Стили для улучшенного модального окна (лайтбокса) с навигацией */
        .lightbox-modal {
            display: none;
            position: fixed;
            z-index: 9999;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.9);
            justify-content: center;
            align-items: center;
        }
        .lightbox-content {
            max-width: 85vw;
            max-height: 85vh;
            object-fit: contain;
            border-radius: 8px;
            box-shadow: 0 5px 30px rgba(0, 0, 0, 0.5);
            transition: transform 0.2s ease;
        }
        .lightbox-close {
            position: absolute;
            top: 25px;
            right: 40px;
            color: #fff;
            font-size: 45px;
            font-weight: 300;
            cursor: pointer;
            z-index: 10000;
            transition: color 0.2s;
        }
        .lightbox-close:hover {
            color: var(--accent-red);
        }
        .lightbox-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255, 255, 255, 0.15);
            color: white;
            border: none;
            font-size: 35px;
            padding: 15px 22px;
            cursor: pointer;
            border-radius: 50%;
            transition: background 0.3s, transform 0.2s;
            z-index: 10000;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .lightbox-nav:hover {
            background: rgba(255, 255, 255, 0.4);
            transform: translateY(-50%) scale(1.1);
        }
        #lightbox-prev { left: 30px; }
        #lightbox-next { right: 30px; }

        @media (max-width: 768px) {
            .lightbox-nav { font-size: 24px; padding: 10px 15px; }
            #lightbox-prev { left: 10px; }
            #lightbox-next { right: 10px; }
            .lightbox-close { top: 15px; right: 20px; font-size: 35px; }
        }
    </style>
</head>
<body>
    <header class="site-header">
       <div class="logo">
            <a href="index.html">
                GH <span style="color: var(--accent-red); margin-left: 5px;">Service</span>
            </a>
       </div>
        <div class="header-right">
            <button class="menu-toggle" id="menu-toggle">☰</button>
            <div class="contact-info">📞 +49 15567548964</div>
            <div class="lang-switch">
                <a href="#" onclick="changeLanguage('de', event)">DE</a> |
                <a href="#" onclick="changeLanguage('ru', event)">RU</a> |
                <a href="#" onclick="changeLanguage('en', event)">EN</a>
            </div>
            <nav id="nav-menu" class="nav-menu">
                <a href="index.html" data-i18n="navHome"></a>
                <a href="about.html" data-i18n="navAbout"></a>
                <a href="gallery.html" data-i18n="navGallery"></a>
                <a href="contact.html" data-i18n="navContact"></a>
                <a href="feedback.html" data-i18n="navFeedback"></a>
                <a href="calculator.html" style="color: var(--accent-red);">Rechner</a>
            </nav>
        </div>
    </header>

    <main>
        <section class="info-section light-bg">
            <h1 class="section-title fade-in" data-i18n="galleryTitle"></h1>
            <div class="gallery-grid">
                <div class="gallery-item fade-in"><img src="images/16.jpg" alt="Fenstermontage GH Service"></div>
                <div class="gallery-item fade-in"><img src="images/17.jpg" alt="Fenstereinbau GH Service"></div>
                <div class="gallery-item fade-in"><img src="images/3.jpg" alt="Montage von Fenstern"></div>
                <div class="gallery-item fade-in"><img src="images/4.jpg" alt="GH Service Work"></div>
                <div class="gallery-item fade-in"><img src="images/5.jpg" alt="GH Service Work"></div>
                <div class="gallery-item fade-in"><img src="images/6.jpg" alt="GH Service Work"></div>
                <div class="gallery-item fade-in"><img src="images/7.jpg" alt="GH Service Work"></div>
                <div class="gallery-item fade-in"><img src="images/10.jpg" alt="GH Service Work"></div>
                <div class="gallery-item fade-in"><img src="images/11.jpg" alt="GH Service Work"></div>
                <div class="gallery-item fade-in"><img src="images/12.jpg" alt="GH Service Work"></div>
                <div class="gallery-item fade-in"><img src="images/13.jpg" alt="GH Service Work"></div>
                <div class="gallery-item fade-in"><img src="images/14.jpg" alt="GH Service Work"></div>
            </div>
        </section>
    </main>

    <!-- Улучшенное модальное окно с навигацией -->
    <div id="lightbox-modal" class="lightbox-modal">
        <span class="lightbox-close">&times;</span>
        <button id="lightbox-prev" class="lightbox-nav">&#10094;</button>
        <img class="lightbox-content" id="lightbox-img" alt="Enlarged view">
        <button id="lightbox-next" class="lightbox-nav">&#10095;</button>
    </div>

    <footer>
        <span data-i18n="footerText"></span>
        <div class="legal-links">
            <a href="datenschutz.html" data-i18n="navDatenschutz">Datenschutz</a> |
            <a href="impressum.html" data-i18n="navImpressum">Impressum</a>
        </div>
    </footer>
    
    <script src="script.js"></script>
    <script>
        // Логика галереи с переключением стрелками
        document.addEventListener("DOMContentLoaded", function() {
            const modal = document.getElementById("lightbox-modal");
            const modalImg = document.getElementById("lightbox-img");
            const closeBtn = document.querySelector(".lightbox-close");
            const prevBtn = document.getElementById("lightbox-prev");
            const nextBtn = document.getElementById("lightbox-next");
            const images = document.querySelectorAll(".gallery-grid img");
            
            let currentIndex = 0;
            const imagesArray = Array.from(images);

            function showImage(index) {
                if (index < 0) {
                    currentIndex = imagesArray.length - 1;
                } else if (index >= imagesArray.length) {
                    currentIndex = 0;
                } else {
                    currentIndex = index;
                }
                modalImg.src = imagesArray[currentIndex].src;
            }

            imagesArray.forEach((img, index) => {
                img.style.cursor = "pointer";
                img.addEventListener("click", () => {
                    modal.style.display = "flex";
                    showImage(index);
                });
            });

            closeBtn.addEventListener("click", () => {
                modal.style.display = "none";
            });

            prevBtn.addEventListener("click", (e) => {
                e.stopPropagation();
                showImage(currentIndex - 1);
            });

            nextBtn.addEventListener("click", (e) => {
                e.stopPropagation();
                showImage(currentIndex + 1);
            });

            // Закрытие при клике вне картинки
            modal.addEventListener("click", (e) => {
                if (e.target === modal) {
                    modal.style.display = "none";
                }
            });

            // Управление с клавиатуры (стрелки и Esc)
            document.addEventListener("keydown", (e) => {
                if (modal.style.display === "flex") {
                    if (e.key === "ArrowLeft") {
                        showImage(currentIndex - 1);
                    } else if (e.key === "ArrowRight") {
                        showImage(currentIndex + 1);
                    } else if (e.key === "Escape") {
                        modal.style.display = "none";
                    }
                }
            });
        });
    </script>
</body>
</html>
