<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="pageTitle">GH Service | Feedback</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="site-header">
       <div class="logo">
    <a href="index.html">
        <img src="images/log_10.jpg" alt="GH Service" class="logo-img">
    </a>
</div>
        <div class="header-right">
            <button class="menu-toggle" id="menu-toggle">☰</button>
            <div class="contact-info">📞 +49 15567548964</div>
            <div class="lang-switch">
                <a href="#" onclick="changeLanguage('de', event)">DE</a> |
                <a href="#" onclick="changeLanguage('ru', event)">RU</a> |
                <a href="#" onclick="changeLanguage('en', event)">EN</a>
            </div>
            <nav id="nav-menu" class="nav-menu">
                <a href="index.html" data-i18n="navHome"></a>
                <a href="about.html" data-i18n="navAbout"></a>
                <a href="gallery.html" data-i18n="navGallery"></a>
                <a href="contact.html" data-i18n="navContact"></a>
                <a href="feedback.html" data-i18n="navFeedback"></a>
            </nav>
        </div>
    </header>

    <main>
        <section class="info-section light-bg" style="min-height: 70vh; display: flex; align-items: center;">
            <div class="form-wrapper fade-in" style="width: 100%;">
                <h2 class="section-title" data-i18n="navFeedback" style="text-align: center; margin-bottom: 30px;"></h2>
                <form class="modern-form" onsubmit="event.preventDefault(); alert('Vielen Dank für Ihre Nachricht!');">
                    <div>
                        <label data-i18n="formName"></label>
                        <input type="text" required>
                    </div>
                    <div>
                        <label data-i18n="formEmail"></label>
                        <input type="email" required>
                    </div>
                    <div>
                        <label data-i18n="formMessage"></label>
                        <textarea rows="5" required></textarea>
                    </div>
                    <button type="submit" class="cta-button" data-i18n="formSubmit" style="width: 100%; text-align: center;"></button>
                </form>
            </div>
        </section>
    </main>

    <footer>
        <span data-i18n="footerText"></span>
        <div class="legal-links">
            <a href="datenschutz.html" data-i18n="navDatenschutz"></a> |
            <a href="impressum.html" data-i18n="navImpressum"></a>
        </div>
    </footer>
    <script src="script.js"></script>
</body>
</html>
